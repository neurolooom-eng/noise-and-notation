name: Apply Supabase migrations

# Runs the SQL in supabase/migrations against your Supabase Postgres.
# Requires repository secret SUPABASE_DB_URL (Supabase → Connect → "Session pooler" URI).
# Each file is applied once; applied files are recorded in public.schema_migrations.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when SUPABASE_DB_URL is not configured
        id: guard
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — skipping. Run the SQL manually in the Supabase SQL editor instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql
        if: steps.guard.outputs.skip != 'true'
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Apply new migrations (each file once, tracked in public.schema_migrations)
        if: steps.guard.outputs.skip != 'true'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c \
            "create table if not exists public.schema_migrations (filename text primary key, applied_at timestamptz not null default now())"
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            if [ "$(psql "$SUPABASE_DB_URL" -tAc "select 1 from public.schema_migrations where filename = '$name'")" = "1" ]; then
              echo "Skipping $name (already applied)"
              continue
            fi
            echo "Applying $name"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q --single-transaction \
              -f "$f" \
              -c "insert into public.schema_migrations (filename) values ('$name') on conflict do nothing"
          done
